<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>You are offline — Frioo</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#EEF3EC" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    :root {
      --fr-canvas: #F5F8F3;
      --fr-surface: #FFFFFF;
      --fr-surface-2: #EEF3EC;
      --fr-text: #16211B;
      --fr-text-2: #47564D;
      --fr-line: #DCE5DD;
      --fr-brand: #1B4D3E;
      --fr-brand-press: #123A2E;
      --fr-brand-tint: #E3EFE7;
      --fr-on-brand: #FFFFFF;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      padding-bottom: max(24px, env(safe-area-inset-bottom));
      background: var(--fr-canvas);
      font-family: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .panel {
      width: 100%;
      max-width: 420px;
      background: var(--fr-surface);
      border: 1px solid var(--fr-line);
      border-radius: 16px;
      padding: 40px 32px;
      text-align: center;
    }

    .mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 60px;
      height: 60px;
      margin-bottom: 24px;
      border-radius: 999px;
      background: var(--fr-brand-tint);
      color: var(--fr-brand);
    }

    .wordmark {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.375rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--fr-brand);
      margin-bottom: 20px;
    }

    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.75rem;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.01em;
      color: var(--fr-text);
      margin-bottom: 12px;
    }

    p {
      font-size: 0.9375rem;
      font-weight: 500;
      line-height: 1.6;
      color: var(--fr-text-2);
      margin-bottom: 28px;
    }

    button {
      width: 100%;
      min-height: 48px;
      padding: 0 24px;
      background: var(--fr-brand);
      color: var(--fr-on-brand);
      border: none;
      border-radius: 6px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.2;
      cursor: pointer;
      transition: background 180ms cubic-bezier(0.2, 0, 0, 1);
    }

    button:hover { background: var(--fr-brand-press); }
    button:focus-visible { outline: 2px solid var(--fr-brand); outline-offset: 3px; }

    @media (prefers-reduced-motion: reduce) {
      button { transition: none; }
    }
  </style>
</head>

<body>
  <main class="panel">
    <span class="mark" aria-hidden="true">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 1l22 22" />
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55" />
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39" />
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9" />
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88" />
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
        <line x1="12" y1="20" x2="12.01" y2="20" />
      </svg>
    </span>

    <div class="wordmark">Frioo.</div>

    <h1>You&rsquo;re offline</h1>
    <p>You can still browse products you have already viewed. Reconnect to continue shopping.</p>

    <button type="button" onclick="window.location.reload()">Retry</button>
  </main>

  <script>
    window.addEventListener('online', function () { window.location.reload(); });
  </script>
</body>

</html>
